name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build AnimeScheduleSync -c Release
      - run: dotnet run --project AnimeScheduleSync.Tests -c Release -- --web
      - run: python3 scripts/validate_catalogue.py
